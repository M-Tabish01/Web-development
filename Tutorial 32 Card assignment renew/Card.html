<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: lightslategray;
        display: flex;
        justify-content: center; /*Center horizontally*/
        align-items: center; /*center vertically*/ 
        
        
        }
        
        .card {
            border-radius: 7px;
            background-color: white;
            width: 250px;
            height: 490px;
            border: 2px solid white;
            box-shadow:0px 0px 20px 3px gray;
        }

        .img img {
            border-radius: 15px;
            padding: 5px;
        }

        .nature {
            padding: 2px 10px 0 13px;
            /* padding: 0 18px; */
        }

        .nature span {
            border-radius: 21px;
            padding: 2px 6px;
            border: 1px solid grey;
            font-size: 14px;
        }

        h2 {
            padding: 15px 10px 0px 10px;
            /* margin: 12px; */
        }

        .main {
            font-size: 14px;
            padding: 0px 10px;
            /* margin: 12px; */
            color: gray;

        }

        .content {
            font-family: "Poppins", sans-serif;
            font-weight: 200;
            font-style: normal;

        }
        .button{
            padding: 20px 0px;
            text-align: center;
        }
        .button button{
            border: 2px solid #00e1ff;
            background-color: rgb(163, 231, 249);
            color: rgb(0, 170, 255);
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
        .button button:hover{
            background-color: rgb(29, 120, 246);  
            color: rgb(108, 198, 236);
        }

    </style>
</head>

<body>
    <div class="card">
        <div class="img"><img width="240" height="190px"
                src="https://cdn.pixabay.com/photo/2020/08/11/03/08/boat-5479122_1280.jpg" alt="">
        </div>
        <div class="nature">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <h2>Invitation</h2>
            <div class="main">Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti provident itaque a rerum
                distinctio? Iure assumenda numquam eaque earum soluta labore odit a?</div>
            </div>
            <div class="button">
                <button>Read More</button>
            </div>
    </div>

</body>

</html>
