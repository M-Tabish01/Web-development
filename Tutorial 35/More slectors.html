<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on selectors</title>
    <style>
        /* .box:first-child{
            background-color: red;
        }
        .main:first-child::first-line{
            color: blue;
            font-size: 20px;
        }
        .main *{
            color: purple;
        } */
        .main::before{
            content:My name is tabish;
            color: red;
        }
        .main::after{
            content: See you Next time;
        }
        ::selection{
            color: aqua;
            background-color: black;
        }
        .box.box::first-letter{
            color: darkred;
        }
        ::placeholder{
            color: red;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">Whatever am first box Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus cumque est
            officiis quod ipsa quo ut iste ex sequi in. </div>
        <div class="box">I am second box</div>
        <div class="box">I am third box</div>
        <input type="text" placeholder="Type your text here...">
    </div>
</body>

</html>
