<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-edit navbar </title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            justify-content: space-around;
            padding: 15px;
            display: flex;
            /* align-items: anchor-center;*/
        }
        
        ul {
            /* margin: 0px 0px 0px 130px; */
            display: flex;
            list-style: none;
            padding: 10px   ;
        }

        img {
            width: 30px;
            border: 2px solid black;
        }

        li {
            font-size: 10px;
            padding: 0px 10px;
            /* justify-content: right; */
        }
        .small{
            font-size: 8px;
        }
       
    </style>
</head>

<body>
    <nav>
        <img src="st vision.jpg" alt="">
        <ul>
            <li>Products</li>
            <li>Pricing</li>
            <li>Resources</li>
            <li>About us</li>
        </ul>
    </nav>
</body>

</html>
