<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra navbar</title>
    <style>
        img {
            width: 30px;
            height: 30px;
            /* background-color: red; */
        }

        nav {
            align-items: center;
            display: flex;
            justify-content: space-around;
        }

        ul {
            
            display: flex;
            list-style: none;
        }
        ul li{
            padding: 0px 20px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo"><img src="st vision.jpg" alt=""></div>
        <div class="right">
            <ul>
                <li>Products</li>
                <li>Pricing</li>
                <li>Resources</li>
                <li>About us</li>
            </ul>
        </div>
    </nav>
</body>

</html>
