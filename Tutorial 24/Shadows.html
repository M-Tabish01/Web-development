<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and outline</title>
    <style>
        .sh {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border: 2px solid black;
            border-radius: 17px;
            background-color: #FF8A65;
            box-sizing: border-box;
            font-size: 65px;
            margin: auto;
            width: 417px;
            height: 76px;
            color: purple;
            /* width: 15vw; */
            text-shadow: 7px 5px 9px #ffffff91;
            box-shadow: 6px 6px 8px purple;
        }

        .hobby {
            outline:3px solid blue;
            text-decoration: underline;
            text-decoration-style: dashed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration-color: blue;
            text-shadow: 1px 2px 20px blue;
            width: 250px; 
            border-radius: 16px;
            /* height: 10px; */
            color: darkblue;
        }

        .fav {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-top: -12px;
            text-indent: 220px;

        }
    </style>
</head>

<body>
    <h1 class="sh">First Website</h1>
    <h2 class="hobby">My Favourite Hobby:-</h2>
    <p class="fav">
        My name is Tabish. My Favourite hobby is PC Games and i love to play it sometimes but because of study and
        career stress i quite it. But once i achieved my goals i will play again...
    </p>
</body>

</html>
