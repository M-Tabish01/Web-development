<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and outline</title>
    <style>
        .sh {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border: 2px solid black;
            border-radius: 17px;
            background-color: #FF8A65;
            box-sizing: border-box;
            font-size: 6vw;
            /* responsive font size */
            margin: auto;
            max-width: 90%;
            /* responsive width */
            height: auto;
            color: purple;
            text-align: center;
            /* center text */
            text-shadow: 7px 5px 9px #ffffff91;
            box-shadow: 6px 6px 8px purple;
        }

        .hobby {
            outline: 3px solid blue;
            text-decoration: underline;
            text-decoration-style: dashed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration-color: blue;
            text-shadow: 1px 2px 20px blue;
            max-width: 90%;
            /* responsive */
            border-radius: 16px;
            color: darkblue;
            margin: 20px auto;
            padding: 5px;
            word-wrap: break-word;
        }

        .fav {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 10px auto;
            text-indent: 0;
            /* remove big indent for small screens */
            max-width: 90%;
        }
    </style>
</head>

<body>
    <h1 class="sh">First Website</h1>
    <h2 class="hobby">My Favourite Hobby:-</h2>
    <p class="fav">
        My name is Tabish. My Favourite hobby is PC Games and i love to play it sometimes but because of study and
        career stress i quite it. But once i achieved my goals i will play again...
    </p>
</body>

</html>
