<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 60vw;
        }
        .img1{
            filter: blur(3px);
        }
        .img2{
            filter: brightness(150%);
        }
        .img3{
            filter: drop-shadow(0px 0px 0px red );
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="wallpaperflare.com_wallpaper (13).jpg" alt="" >
        <img class="img2" src="wallpaperflare.com_wallpaper (16).jpg" alt="" >
        <img class="img3" src="wallpaperflare.com_wallpaper (19).jpg" alt="" >
    </div>
</body>
</html>
