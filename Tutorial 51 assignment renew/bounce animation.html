<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 80vw;
            height: 80vh;
            background-color: violet;
            border: 2px solid black;
            position: relative;
        }
        .ball{
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 100%;
            position: absolute;
            bottom: 0;
            animation: X-axis 5s ease-out infinite, Y-axis 1s ease-out infinite alternate;
        }
        @keyframes X-axis {
            from{
                left: 0;
            }
            to{
                left: 90vw;
            }
        }
        @keyframes Y-axis {
            from{
                bottom: 0;
            }
            to{
                bottom: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball">

        </div>
    </div>
</body>
</html>
