<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css display property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .tabish{
            border: 2px solid black;
            display: inline-block;
            width: 250px;
            text-align: center;
            margin: 10px;
            padding: 20px;

        }
        span{
            border: 2px solid black;
            margin: 10px;
            padding: 20px;
            
        }
    </style>
</head>
<body>
    <div class="tabish">My name is tabish</div>
    <div class="old tabish">And iam 19 years old</div>   
    <span>I am a good boy </span>
    <span>I am not a  bad boy </span>
</body>
</html>
