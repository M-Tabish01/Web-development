<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS VARIABLES</title>
    <style>
        :root {
            --color: red;
            --padding: 10px;
        }

        * {
            padding: 0;
            margin: 0;

        }

        ul {
            display: flex;
            color: var(--color);
        }

        li {
            list-style: none;
            padding: 20px;
            margin: 5px;
        }
        p{
            border: 2px solid black;
            background-color: var(--color);
            padding: var(--padding);
        }
    </style>
</head>

<body>
    <div>
        <ul>
            <li>Home</li>
            <li>Service</li>
            <li>Support</li>
        </ul>
    </div>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quam, labore quidem hic nobis nam voluptates, odit,
        quas rerum ipsam amet quod facilis tempora?</p>
</body>

</html>
