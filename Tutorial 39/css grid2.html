<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 1</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-areas:
                "nav nav nav"
                "side article article"
                "footer footer footer";
        }

        .item {
            border: 2px solid red;
            height: 55px;
            /* width: 55px; */
        }


        .item-1 {
            grid-area: nav;
            /* grid-row: 1/2; */
            /* grid-column: 1/2; */
        }

        .item-2 {
            grid-area: main;
            /* grid-row: 1/2; */
            /* grid-column: 1/2; */
        }

        .item-3 {
            grid-area: article;
            /* grid-row: 1/2; */
            /* grid-column: 1/2; */
        }

        .item-4 {
            grid-area: footer;
            /* grid-row: 1/2; */
            /* grid-column: 1/2; */
        }

        /* .item-5 {
            /* grid-row: 1/2; */
        /* grid-column: 1/2;
     } */
    </style>
</head>

<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
        <div class="item item-5">5</div>
    </div>
</body>

</html>
