<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box model</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .box{
            background-color: lightcoral;
        }
        .box1{
            color: white;
            margin: 5px;
            padding: 10px;
            border: 2px solid pink;
            height: 100px;
            box-sizing: border-box;
        }
        .box2{
            color: yellow;
        }

    </style>
</head>
<body>
    <div class="box box1">Hey iam a box</div>
    <div class="box box2">Hey this is a another box</div>
</body>
</html>
