<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        .outside {
            margin: 20px auto;
            padding: 1vw;
            width: 25vw;
            height: 7 0vh;
            border: 1px solid grey;
            border-radius: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            

        }

        div img {
            border-radius: 15px;
            width: 25vw;
        }

        /* div ul{
            display: flex;
            list-style: none;
            margin-left: 10px;
        } */
        .list {
            list-style: none;
            display: inline-block;
            border: 1px solid grey;
            border-radius: 100px;
            padding: 6px;
        }

        .N {
            position: relative;
            left: -25px;
        }

        .L {
            position: relative;
            left: -19px;
        }

        div>p {
            background-color: rgba(139, 201, 239, 0.642);
            color: blue;
            border: 1px;
            text-align: center;
            width: 100px;
            left: 100px;
            position: relative; 
            border-radius: 100px;
            padding: 10px;

        }
    </style>
</head>

<body>
    <div class="outside">
        <img src="wallpaperflare.com_wallpaper (16).jpg" alt="">
        <ul>
            <li class="list N">Nature</li>
            <li class="list L">Lake</li>
        </ul>
        <H2>Invitation of Marriage</H2>

            impedit! Veritatis quidem optio esse voluptatibus recusandae?</main>
        <p>Read More</p>

</html>
